<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — İletken Hızlı Okuma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .form-control {
      background-color: #0f172a;
      color: #e5e7eb;
      border-color: #334155;
    }

    .form-control:focus {
      background-color: #0f172a;
      color: #e5e7eb;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .form-control::placeholder {
      color: #64748b;
    }

    .form-label {
      color: #94a3b8;
      font-size: .9rem;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="text-center mb-4">
    <h4 class="fw-bold text-warning mb-1">İletken Hızlı Okuma</h4>
    <p class="text-secondary mb-0" style="font-size:.9rem;">Devam etmek için giriş yapın</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="mb-3">
      <label for="email" class="form-label">E-posta</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        placeholder="ornek@email.com"
        autocomplete="email"
        required
      >
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Şifre</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      >
    </div>
    <div class="d-grid">
      <button type="submit" class="btn btn-primary btn-lg">Giriş Yap</button>
    </div>
  </form>
</div>

</body>
</html>
